name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Superseded runs of the same ref cancel; the VM test jobs are not cheap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # One job per supported arch/os: lint, then as much of the test suite
  # as the runner can actually run.
  #
  # The matrix IS the supported matrix: the guest arch matches the host
  # (KVM/HVF are same-arch). Each entry lints its arch NATIVELY, so every
  # cfg-gated module compiles somewhere: the x86_64 Linux entries cover the
  # KVM code, the macOS entry the aarch64 code (vm/aarch64.rs, the crafted
  # ARM init, the ARM64 DSL) plus the HVF/macOS modules, and the Windows
  # entry the WHP backend — build.rs links whp.dll by name and the crate
  # compiles clean there (verified from WSL against the MSVC toolchain:
  # clippy -D warnings and the unit tests pass natively).
  #
  # Nested virtualization decides the suite's shape per entry: Linux x86_64
  # (/dev/kvm) and macOS arm64 (HVF) run the FULL 17-entry suite; the ARM
  # runners ship no /dev/kvm, so there the suite self-skips (the python
  # tests via vm_harness, the bash gates via their /dev/kvm check) and the
  # unit tests are the real payload. `make test` IS the suite — the
  # suite's own skips shape it per runner.
  #
  # Lint first (fastest failures first): format, then clippy — the crate
  # typechecks without the guest kernel or a hypervisor (the rootfs is
  # committed). Then the tests: `make test` on the Unix entries (it
  # builds, fetches the guest kernel, runs the cargo unit tests and the
  # 17-entry integration suite — boot-time, devices, blk, exit codes,
  # console input, marker passthrough, export, layer, share, geometry,
  # tmux (+attached), python REPL, packages, the curl-hang stress and the
  # interactive hang gate); plain cargo on Windows, which has no make and
  # no nested virtualization on GitHub runners — its payload is the unit
  # tests (the VM tests would only self-skip: vm_harness.host_can_run_vm).
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux aarch64
            os: ubuntu-24.04-arm
          - name: macOS aarch64
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # The guest kernel is fetched per run (verified against the
      # sandal-assets release SHA256SUMS); caching it skips the download.
      - name: Cache guest kernel (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: vmlinux-sandal-*
          key: kernel-${{ runner.os }}-${{ hashFiles('scripts/fetch-kernel.sh') }}

      # Only where the runner actually ships it; the ARM runners do not
      # (the suite self-skips there instead of failing).
      # The debugging branch's instrument: a bare C probe, no VMM, no guest
      # RAM — if hv_vm_create fails identically here, the failure is the
      # host's, not the VMM's. Also names 0xFAE9400F from the SDK header.
      - name: HVF diagnostics (macOS)
        if: runner.os == 'macOS'
        run: |
          sw_vers
          sysctl hw.memsize hw.model
          HDR="$(xcrun --show-sdk-path)/System/Library/Frameworks/Hypervisor.framework/Headers/Hypervisor.h"
          grep -n "fae940" "$HDR" || true
          cat > /tmp/hvfprobe.c <<'EOF'
          #include <Hypervisor/Hypervisor.h>
          #include <stdio.h>
          #include <unistd.h>
          int main(void) {
              for (int i = 0; i < 12; i++) {
                  hv_return_t r = hv_vm_create(NULL);
                  printf("create %2d: %#010x\n", i, r);
                  if (r == HV_SUCCESS) hv_vm_destroy();
                  sleep(5);
              }
          }
          EOF
          cc /tmp/hvfprobe.c -o /tmp/hvfprobe -framework Hypervisor
          printf '%s\n'             '<?xml version="1.0" encoding="UTF-8"?>'             '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'             '<plist version="1.0"><dict><key>com.apple.vm.hypervisor</key><true/></dict></plist>'             > /tmp/ent.plist
          codesign -s - --entitlements /tmp/ent.plist /tmp/hvfprobe
          /tmp/hvfprobe

      - name: KVM permissions (Linux x86_64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          [ -e /dev/kvm ] || { echo "no /dev/kvm on this runner"; exit 1; }
          sudo chmod 666 /dev/kvm

      # The curl-hang gate drives an expect script; macOS ships expect.
      # Only the KVM runners reach it (elsewhere the gate self-skips).
      - name: Install expect (Linux x86_64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: sudo apt-get update -q && sudo apt-get install -y -q expect

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build, fetch kernel, run the suite (Unix)
        if: runner.os != 'Windows'
        run: make test

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --release
